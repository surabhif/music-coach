# Sync Gradio Space https://huggingface.co/spaces/surabhif/music-coach via huggingface_hub (Xet).
# Plain git push is rejected for binaries (experts/*.wav); upload_folder handles Xet storage.
# Required secret: HF_TOKEN (Hugging Face write token for that Space)
name: sync-hf-space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_SPACE: surabhif/music-coach

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check HF_TOKEN
        id: creds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Add repository secret HF_TOKEN (write access to spaces/surabhif/music-coach) to enable sync."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_token == 'true'

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.has_token == 'true'
        with:
          python-version: "3.12"

      - name: Install huggingface_hub (Xet)
        if: steps.creds.outputs.has_token == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -U "huggingface_hub[hf_xet]"

      - name: Upload Space folder (API / Xet)
        if: steps.creds.outputs.has_token == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/sync_hf_space.py
