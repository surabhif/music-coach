name: tests

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate test audio
        run: python make_test_audio.py

      - name: Run pipeline tests
        env:
          VOCALMATCH_DATA: ${{ runner.temp }}/vocalmatch-data
        run: |
          mkdir -p "$VOCALMATCH_DATA"
          python test_e2e.py
          python test_indian.py
          python test_sections.py
